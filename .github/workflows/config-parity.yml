name: Config-driven extraction parity

on:
  pull_request:
    paths:
      - "configs/extraction_runtime.yaml"
      - "word_parser/**"
      - "tests/test_config_driven_parity.py"
      - "tests/test_retrieval_yaml_parity.py"
      - "tests/test_shared_field_registry.py"
      - "tests/test_extraction_grammar_yaml_parity.py"
      - "tests/test_output_field_contract.py"
      - "tests/test_primary_operator_registry_parity.py"
      - "tests/test_funnel_yaml_parity.py"
      - "tests/test_candidate_facts_adapter.py"
      - "tests/test_candidate_diagnostics_policy.py"
      - "tests/test_real_report_parity_runner.py"
      - "configs/candidate_audit.yaml"
      - "configs/deterministic_rules.yaml"
      - "tests/test_domain_yaml_parity.py"
      - "tests/test_secondary_merge_invariants.py"
      - "tests/contracts/**"
      - "configs/output_schema.yaml"
      - "tests/test_extraction_config_audit.py"
      - "tests/test_mapped_parity_tool.py"
      - "tools/scripts/compare_mapped.py"
      - "tools/scripts/audit_candidate_facts.py"
      - "tools/scripts/run_real_report_parity.py"
      - "tools/scripts/audit_extraction_config.py"
      - ".github/workflows/config-parity.yml"

jobs:
  config-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight rule-engine test dependencies
        run: python -m pip install pyyaml rapidfuzz pyahocorasick loguru pytest pandas httpx
      - name: Compile modified Python sources
        run: |
          python -m compileall -q word_parser/application/factory.py word_parser/discovery/indicators.py word_parser/primary
          python -m compileall -q tools/scripts/compare_mapped.py tools/scripts/audit_extraction_config.py
          python -m compileall -q word_parser/extraction/candidate_facts.py word_parser/extraction/candidate_diagnostics.py tools/scripts/audit_candidate_facts.py
          python -m compileall -q word_parser/secondary/table_values/resolver.py tools/scripts/run_real_report_parity.py
      - name: Audit configuration rules
        run: python tools/scripts/audit_extraction_config.py --config-root configs
      - name: Check YAML parity and extraction contract
        run: python -m pytest tests/test_domain_yaml_parity.py tests/test_real_report_parity_runner.py tests/test_candidate_diagnostics_policy.py tests/test_secondary_merge_invariants.py tests/test_candidate_facts_adapter.py tests/test_funnel_yaml_parity.py tests/test_primary_operator_registry_parity.py tests/test_output_field_contract.py tests/test_extraction_grammar_yaml_parity.py tests/test_shared_field_registry.py tests/test_retrieval_yaml_parity.py tests/test_mapped_parity_tool.py tests/test_extraction_config_audit.py tests/test_config_driven_parity.py tests/test_indicator_discovery.py tests/test_context_constraints.py tests/test_recall_recovery.py tests/test_equivalent_extraction.py tests/test_table_values_new_primitives.py tests/test_public_structure.py -q
