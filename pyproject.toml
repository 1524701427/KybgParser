[project]
name = "word-parser"
version = "0.1.0"
description = "不使用 LLM 的可研报告 Word 解析引擎"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "loguru>=0.7",
    "regex>=2023.0",
    "pythonnet>=3.0",
]

[project.optional-dependencies]
aspose = ["aspose-words>=24.0"]
ml = ["torch>=2.0", "transformers>=4.40", "sentence-transformers>=3.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
