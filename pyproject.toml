[project]
name = "word-parser"
version = "0.1.0"
description = "不使用 LLM 的可研报告 Word 解析引擎"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "pandas>=2.0",
    "loguru>=0.7",
    "regex>=2023.0",
    "pythonnet>=3.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "rapidfuzz>=3.0",
    "pyahocorasick>=2.0",
]

[project.optional-dependencies]
aspose = ["aspose-words>=24.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
