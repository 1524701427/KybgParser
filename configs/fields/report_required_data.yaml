fields:
  metTowerCode:
    name: 测风塔编号
    value_type: string
    multi_value: true
    sections:
      include:
        - 资源章节
        - 风资源
        - 解析数据
      exclude: []
    aliases:
      - 测风塔编号
    patterns:
      - (?:测风塔编号).{0,30}?([0-9A-Za-z#-]+)
  windTowerLongitude:
    name: 测风塔经度
    value_type: string
    multi_value: true
    sections:
      include: [资源章节, 风资源, 解析数据]
      exclude: []
    aliases: [测风塔经度, 经度, 东经, 经纬度, 坐标]
    patterns:
      - '(?:测风塔)?(?:经度|东经)[：:\s]*((?:东经|[Ee])?\s*\d{3}(?:\.\d+)?(?:\s*[°度]\s*\d{1,2}(?:\.\d+)?(?:\s*[′分'']\s*\d{1,2}(?:\.\d+)?\s*[″秒"]?)?)?)'
      - '(?:经纬度|坐标)[^。；;\n]{0,80}?((?:东经|[Ee])\s*\d{2,3}(?:\.\d+)?(?:\s*[°度]\s*\d{1,2}(?:\.\d+)?(?:\s*[′分'']\s*\d{1,2}(?:\.\d+)?\s*[″秒"]?)?)?)'
  windTowerLatitude:
    name: 测风塔纬度
    value_type: string
    multi_value: true
    sections:
      include: [资源章节, 风资源, 解析数据]
      exclude: []
    aliases: [测风塔纬度, 纬度, 北纬, 经纬度, 坐标]
    patterns:
      - '(?:测风塔)?(?:纬度|北纬)[：:\s]*((?:北纬|[Nn])?\s*\d{2}(?:\.\d+)?(?:\s*[°度]\s*\d{1,2}(?:\.\d+)?(?:\s*[′分'']\s*\d{1,2}(?:\.\d+)?\s*[″秒"]?)?)?)'
      - '(?:经纬度|坐标)[^。；;\n]{0,80}?((?:北纬|[Nn])\s*\d{2}(?:\.\d+)?(?:\s*[°度]\s*\d{1,2}(?:\.\d+)?(?:\s*[′分'']\s*\d{1,2}(?:\.\d+)?\s*[″秒"]?)?)?)'
  windMeasurementPeriod:
    name: 测风周期
    value_type: string
    multi_value: true
    sections:
      include: [资源章节, 风资源, 解析数据]
      exclude: []
    aliases: [测风周期, 测风时段, 观测周期, 观测时段]
    patterns:
      - '(?:测风周期|测风时段|观测周期|观测时段)[：:\s]*([^，。；;\n|]{3,80})'
  airDensityAtHeight:
    name: 高度对应的空气密度
    value_type: number
    multi_value: true
    standard_unit: kg/m3
    sections:
      include:
        - 资源章节
        - 风资源
        - 解析数据
      exclude: []
    aliases:
      - 高度对应的空气密度
      - 空气密度
    unit_aliases:
      - kg/m³
      - kg/m3
    multi_number_pattern: 空气密度分别为([^。；;\n]+)
    patterns:
      - 计算得到本项目区域空气密度分别为([0-9]+(?:\.[0-9]+)?)\s*(kg/m³|kg/m3)?
      - (?:高度对应的空气密度|空气密度).{0,40}?([0-9]+(?:\.[0-9]+)?)\s*(kg/m³|kg/m3)?
    validators:
      min: 0
  windFarmAirDensities:
    name: 该风电场的空气密度
    value_type: number
    multi_value: true
    standard_unit: kg/m3
    coarse_table_rule_enabled: false
    sections:
      include:
        - 资源章节
        - 风资源
        - 解析数据
      exclude: []
    aliases:
      - 该风电场的空气密度
      - 该风电场空气密度
      - 本风电场空气密度
      - 风电场区域空气密度
      - 本项目区域空气密度
    unit_aliases:
      - kg/m³
      - kg/m3
    patterns:
      - (?:该|本)(?:风电场|项目)(?:区域)?的?空气密度(?:采用|为|是|计算得到)?\s*([0-9]+(?:\.[0-9]+)?)\s*(kg/m³|kg/m3)?
      - (?:风电场|项目)(?:区域)?空气密度(?:采用|为|是|计算得到)?\s*([0-9]+(?:\.[0-9]+)?)\s*(kg/m³|kg/m3)?
      - 计算得到(?:该|本)?(?:风电场|项目)(?:区域)?的?空气密度(?:为)?\s*([0-9]+(?:\.[0-9]+)?)\s*(kg/m³|kg/m3)?
    validators:
      min: 0
      max: 2
  hubHeightWindPowerDensity:
    name: 轮毂高度平均风功率密度
    value_type: number
    multi_value: true
    standard_unit: W/m2
    sections:
      include:
        - 资源章节
        - 风资源
        - 解析数据
      exclude: []
    aliases:
      - 轮毂高度平均风功率密度
      - 平均风功率密度
    unit_aliases:
      - W/m²
      - W/m2
    patterns:
      - (?:轮毂高度平均风功率密度|平均风功率密度).{0,40}?([0-9]+(?:\.[0-9]+)?)\s*(W/m²|W/m2)?
    table_lookup:
      row_aliases:
        - 风功率
      column_aliases:
        - 年均
    validators:
      min: 0
  hubHeightMainWindDirection:
    name: 轮毂高度处的主风向
    value_type: string
    multi_value: true
    sections:
      include:
        - 资源章节
        - 风资源
        - 解析数据
      exclude: []
    aliases:
      - 轮毂高度处的主风向
      - 主风向
    patterns:
      - (?:轮毂高度处的主风向|主风向)[:：\s]*([A-Z]{1,4}|[东南西北偏]+)
  hubHeightAnnualAverageWindSpeed:
    name: 轮毂高度年平均风速
    value_type: number
    multi_value: true
    standard_unit: m/s
    sections:
      include:
        - 资源章节
        - 风资源
        - 解析数据
      exclude: []
    aliases:
      - 轮毂高度平均风速
      - 年平均风速
      - 风速
    unit_aliases:
      - m/s
      - 米/秒
    patterns:
      - (?:轮毂高度平均风速|年平均风速).{0,40}?([0-9]+(?:\.[0-9]+)?)\s*(m/s|米/秒)?
    table_lookup:
      row_aliases:
        - 风速
      column_aliases:
        - 年均
    validators:
      min: 0
      max: 50
  hubHeightMainWindEnergyDirection:
    name: 轮毂高度处的主风能方向
    value_type: string
    sections:
      include:
        - 资源章节
        - 风资源
        - 解析数据
      exclude: []
    aliases:
      - 轮毂高度处的主风能方向
      - 主风能方向
    patterns:
      - (?:轮毂高度处的主风能方向|主风能方向)[:：\s]*([A-Z]{1,4}|[东南西北偏]+)
  representativeTurbulenceIntensity:
    name: 最大高度处代表性湍流强度
    value_type: number
    sections:
      include:
        - 资源章节
        - 风资源
        - 解析数据
      exclude: []
    aliases:
      - 最大高度处代表性湍流强度
      - 代表性湍流强度
      - 湍流强度
    patterns:
      - (?:最大高度处代表性湍流强度|代表性湍流强度|湍流强度).{0,40}?([0-9]+(?:\.[0-9]+)?)
    validators:
      min: 0
  windPowerDensityGrade:
    name: 风功率密度等级
    value_type: string
    standard_unit: 级
    sections:
      include:
        - 资源章节
        - 风资源
        - 解析数据
      exclude: []
    aliases:
      - 风功率密度等级
    patterns:
      - 风功率密度等级[^。；;\n]{0,20}?(?P<value>[A-ZＡ-Ｚ]-?\s*[0-9ⅠⅡⅢⅣⅤⅥ一二三四五六]+)\s*级?
  windShearExponent:
    name: 综合风切变
    value_type: number
    sections:
      include:
        - 资源章节
        - 风资源
        - 解析数据
      exclude: []
    aliases:
      - 综合风切变
      - 风切变
    patterns:
      - (?:综合风切变|风切变).{0,40}?([0-9]+(?:\.[0-9]+)?)
    validators:
      min: 0
  generationCalculationUsed:
    name: 发电量计算是否使用
    value_type: string
    sections:
      include:
        - 资源章节
        - 风资源
        - 解析数据
      exclude: []
    aliases:
      - 发电量计算是否使用
      - 是否使用
    patterns:
      - (?:发电量计算是否使用|是否使用)[:：\s]*(是|否)
  selectedTurbineSafetyClass:
    name: 最终宜选机型
    value_type: string
    extraction_policy: rule_first
    preferred_methods:
      - regex
    sections:
      include:
        - 资源章节
        - 风资源
        - 机型
      exclude:
        - 财务评价
        - 设计依据
        - 编制依据
        - 引用标准
    aliases:
      - 最终宜选机型
      - 宜选机型
      - 安全等级
      - IECⅢa
      - IECⅢC类
      - IEC ⅢC 类
    patterns:
      - '((?:IEC|iec)\s*[\u2160-\u216FIVXIVX]+\s*[a-zA-Z]\s*(?:类|级)?(?:及其以上|及以上|以上)?(?:等级)?(?:的)?(?:风机|风力发电机组|风电机组)?)'
      - '(?:安全等级|宜选|采用)[^。；;\n]{0,60}?((?:IEC|iec)\s*[\u2160-\u216FIVXIVX]+\s*[a-zA-Z]\s*(?:类|级)?(?:及其以上|及以上|以上)?)'
    value_map:
      IECⅢa类及以上: IECIIIa+
      IECⅢa及其以上: IECIIIa+
      IECⅢa及以上: IECIIIa+
      IEC IIIa: IECIIIa+
      IECIIIa: IECIIIa+
    validators:
      allow_pattern: '(?i)IEC'
    scalar_selection:
      strategy: score
    scalar_rules:
    - name: 资源章节正文最终宜选机型
      source_types: [paragraph, table, pdf_page_text]
      value_type: string
      value_group: value
      section_include: [资源, 风资源, 风能资源, 机型, 发电量]
      section_exclude: [财务评价, 设计依据, 编制依据, 引用标准]
      require_any: [IEC]
      patterns:
      - '(?P<value>(?:IEC|iec)\s*[\u2160-\u216FIVX]+\s*[A-Ca-c]\s*(?:类|级)\s*或以上安全等级的(?:风机|风力发电机组|风电机组))'
      - '(?:(?:本|该)?风电场选用适合\s*)(?P<value>(?:IEC|iec)\s*[\u2160-\u216FIVX]+\s*[A-Ca-c]\s*(?:类|级)?(?:及其以上|及以上|以上)?(?:安全等级)?(?:的)?(?:风机|风力发电机组|风电机组))'
      - '(?:采用|建议)[^。；;\n]{0,30}?(?P<value>(?:IEC|iec)\s*61400(?:[-:：]\s*1)?\s*(?::|：)?\s*2019\s*中?的?\s*(?:III|Ⅲ|ⅡI|II[I1])\s*类\s*(?:及以上|以上)?(?:的)?(?:风机|风力发电机组|风电机组))'
      - '(?P<value>(?:IEC|iec)\s*[\u2160-\u216FIVX]+\s*[A-Ca-c]\s*(?:类|级)?(?:及其以上|及以上|以上)?(?:等级)?(?:的)?(?:风机|风力发电机组|风电机组)?)'
      - '(?:安全等级|宜选|采用|推荐)[^。；;\n]{0,60}?(?P<value>(?:IEC|iec)\s*[\u2160-\u216FIVX]+\s*[A-Ca-c]\s*(?:类|级)?(?:及其以上|及以上|以上)?)'
      compact: true
      prefer_any:
        综上: 80
        最终: 60
        宜选: 60
        采用: 40
        推荐: 30
    coarse_table_rule_enabled: false
  nonWakeLossFactor:
    name: 不考虑尾流效应的折减系数
    value_type: number
    standard_unit: '%'
    sections:
      include:
        - 发电量章节
        - 发电量
        - 解析数据
      exclude:
        - 投资估算
    aliases:
      - 不考虑尾流效应的折减系数
      - 综合折减系数
      - 综合折减后
    unit_aliases:
      - '%'
    patterns:
      - \u7efc\u5408\u6298\u51cf\u540e(?:\uff08|\()?\u7efc\u5408\u6298\u51cf\u7cfb\u6570\u4e3a([0-9]+(?:\.[0-9]+)?)\s*(%)?
      - (?:\u4e0d\u8003\u8651\u5c3e\u6d41\u6548\u5e94\u7684\u6298\u51cf\u7cfb\u6570|\u7efc\u5408\u6298\u51cf\u7cfb\u6570).{0,40}?([0-9]+(?:\.[0-9]+)?)\s*(%)?
    validators:
      min: 0
      max: 100
    value_headers:
      - 推荐方案
      - 数量
      - 数  量
      - 合计
      - 总计
    scalar_selection:
      strategy: score
    scalar_rules:
    - name: 发电量正文综合折减率
      source_types: [paragraph, table, pdf_page_text]
      value_type: number
      value_group: value
      unit: '%'
      score: 240
      section_include: [发电量章节, 发电量, 风电场年上网电量估算]
      section_exclude: [投资估算, 财务]
      require_any: [综合折减率]
      patterns:
      - '综合折减率[^0-9%]{0,20}(?P<value>[0-9]+(?:\.[0-9]+)?)\s*(?P<unit>%|％)'
      - '综合折减率\s*(?P<unit>%|％)?\s*[|：:]?\s*(?P<value>[0-9]+(?:\.[0-9]+)?)'
  accessStationName:
    name: 接入站名称
    value_type: string
    sections:
      include: [电气一次, 接入系统, 主接线]
      exclude: [财务]
    aliases: [接入站名称, 升压站, 变电站]
    validators:
      allow_pattern: '(?:变电站|升压站|汇集站|[^，。；;\n]{1,20}变)$'
      reject_patterns:
      - '接入站名称|可接入|\|'
      - '^(?:本工程|本风电场|场内|配套新建).{0,30}?升压站$'
      - '^(?:本期|一期|1期|二期|2期|本项目|本工程|.*风电场).{0,30}?升压站$'
      - '^[0-9]+\s*kV\s*升压站$'
    scalar_selection:
      strategy: score
    scalar_rules:
    - name: 电气一次正文接入汇集站名称
      source_types: [paragraph, table, pdf_page_text]
      value_type: string
      value_group: value
      score: 380
      section_include: [电气一次, 电气, 接入系统, 主接线, 风电场接入系统方式, 风电场年上网电量估算]
      section_exclude: [财务]
      require_any: [汇集站]
      patterns:
      - '(?:打捆送至|汇集后送至|送至)[^，。；;\n]{0,40}?(?P<value>[\u4e00-\u9fa5A-Za-z0-9]+\s*(?:[0-9]+\s*kV\s*)?汇\s*集\s*站)'
      - '(?:接入|接至|送至|送到|送出至)(?:适时扩建|规划扩建|东北方向的|方向的)?\s*(?P<value>[\u4e00-\u9fa5]{1,8}\s*(?:[0-9]+\s*kV\s*)?汇\s*集\s*站)'
      - '(?:接入|接至|送至|送到|送出至)[^，。；;\n]{0,40}?(?P<value>[\u4e00-\u9fa5]{1,6}\s*[\u4e00-\u9fa5]{1,6}\s*(?:[0-9]+\s*kV\s*)?汇\s*集\s*站)'
      - '(?:接入|接至|送至|送到|送出至)[^，。；;\n]{0,30}?(?P<value>[\u4e00-\u9fa5A-Za-z0-9]+\s*[0-9]+\s*kV\s*汇集站)'
      - '(?:接入|接至|送至|送到|送出至)[^，。；;\n]{0,30}?(?P<value>[\u4e00-\u9fa5A-Za-z0-9]{1,20}汇集站)'
      compact: true
      prefer_any:
        汇集站: 120
        接入: 60
        送出: 40
      penalize_any:
        暂定: 20
    - name: 电气一次显式标签接入站名称
      source_types: [paragraph, table, pdf_page_text]
      value_type: string
      value_group: value
      score: 320
      section_include: [电气, 接入系统, 主接线]
      section_exclude: [财务]
      require_any: [接入站名称]
      patterns:
      - '接入站名称(?:\s*\|?\s*接入站名称)?\s*[|：:]?\s*(?P<value>(?:[0-9]+\s*kV)?[^|，。；;\n]{1,12}?变电站)'
      prefer_any:
        接入站名称: 80
        变电站: 80
    - name: 电气一次正文接入目标名称
      source_types: [paragraph, table, pdf_page_text]
      value_type: string
      value_group: value
      section_include: [电气]
      section_exclude: [财务]
      require_any: [接入, 接至, 送至]
      patterns:
      - '(?:接入|接至|送至)\s*(?P<value>[^，。；;\n]{1,20}?变)\s*(?:[0-9]+\s*kV)?\s*母线'
      - '(?:接入|接至|送至)\s*(?P<value>[^，。；;\n]{1,20}?变)(?:。|，|；|;|\n)'
      - '(?:线路|主变升压后|最终)[^，。；;\n]{0,30}?(?:接入|接至|送至)\s*(?P<value>(?:[0-9]+\s*kV)?[^，。；;\n]{1,30}?变电站)'
      - '(?:接入|接至|送至|至)\s*(?P<value>(?:[0-9]+\s*kV)?[^，。；;\n]{1,30}?变电站)'
      - '接入(?:到|至)?\s*(?!本工程|本风电场|场内|配套新建)(?P<value>(?:[0-9]+\s*kV)?[^，。；;\n]{1,30}?升压站)'
      prefer_any:
        变电站: 80
        线路: 40
        升压站: 10
        接入到: 30
        接入至: 20
      penalize_any:
        母线: 80
        箱式升压变电站: 40
  accessibleCapacity:
    name: 可接入容量
    value_type: number
    standard_unit: MVA
    sections:
      include: [电气一次, 接入系统, 风电场接入系统方式]
      exclude: [财务]
    aliases: [可接入容量, 主变容量, 主变]
    scalar_selection:
      strategy: score
    scalar_rules:
    - name: 电气一次接入系统主变容量
      source_types: [paragraph, table, pdf_page_text]
      value_type: number
      value_group: value
      unit: MVA
      score: 260
      section_include: [电气一次, 电气, 接入系统, 风电场接入系统方式, 风电场年上网电量估算]
      section_exclude: [财务]
      require_any: [主变]
      reject_any: [SVG, Mvar, MVar, MVAR, 动态无功, 单价, 万元, 箱式变压器]
      patterns:
      - '(?:升压站)?[^，。；;\n]{0,30}?选用\s*[0-9]+\s*台\s*容量为\s*(?P<value>[0-9]+(?:\.[0-9]+)?)\s*(?P<unit>MVA(?![A-Za-z])|兆伏安)[^，。；;\n]{0,20}?主变'
      - '(?:[0-9]+\s*[台×xX]\s*)?容量为\s*(?P<value>[0-9]+(?:\.[0-9]+)?)\s*(?P<unit>MVA(?![A-Za-z])|兆伏安)[^，。；;\n]{0,30}?主变'
      - '(?:[0-9]+\s*[台×xX]\s*)?(?P<value>[0-9]+(?:\.[0-9]+)?)\s*(?P<unit>MVA(?![A-Za-z])|兆伏安)[^，。；;\n]{0,30}?主变'
      - '主变[^，。；;\n]{0,40}?(?:容量|规模)?[^0-9]{0,12}(?P<value>[0-9]+(?:\.[0-9]+)?)\s*(?P<unit>MVA(?![A-Za-z])|兆伏安)'
      prefer_any:
        容量为: 80
        110kV升压站: 60
        选用: 40
      validators:
        min: 0
        max: 10000
  connectionType:
    name: 主接线形式
    value_type: string
    sections:
      include: [电气一次, 主接线]
      exclude: [财务]
