fields:
  collectorVoltageLevel:
    name: 集电线路电压等级
    value_type: number
    standard_unit: kV
    sections:
      include:
        - 集电线路
        - 电气
        - 电气一次
        - 主要技术经济指标
      exclude:
        - 风资源
        - 财务评价
        - 概算
        - 设备及安装
    aliases:
      - 集电线路电压等级
      - 集电线路电压
      - 集电电压
      - 35kV集电线路
      - 集电线路采用
      - 集电线路
    unit_aliases:
      - kV
      - 千伏
    patterns:
      - \u96c6\u7535\u7ebf\u8def\u91c7\u7528\s*([0-9]+(?:\.[0-9]+)?)\s*(kV|\u5343\u4f0f)?
      - ([0-9]+(?:\.[0-9]+)?)\s*(kV|\u5343\u4f0f)?\s*\u96c6\u7535\u7ebf\u8def
      - (?:\u96c6\u7535\u7ebf\u8def\u7535\u538b\u7b49\u7ea7|\u96c6\u7535\u7ebf\u8def\u7535\u538b|\u96c6\u7535\u7535\u538b).{0,30}?([0-9]+(?:\.[0-9]+)?)\s*(kV|\u5343\u4f0f)?
    validators:
      min: 10
      max: 1000
    value_headers:
      - 线路额定电压
      - 电压等级
      - 电压
    coarse_table_rule_enabled: false
  collectorLineLength:
    name: 集电线路长度
    value_type: number
    standard_unit: km
    sections:
      include:
        - 集电线路
        - 电气
        - 电气一次
        - 主要技术经济指标
      exclude:
        - 财务评价
    aliases:
      - 集电线路长度
      - 集电线路总长
      - 集电线路
      - 线路长度
      - 线路总长度
      - 总长
    unit_aliases:
      - km
      - 公里
      - m
      - 米
    patterns:
      - (?:集电线路长度|集电线路总长).{0,30}?([0-9]+(?:\.[0-9]+)?)\s*(km|公里|m|米)?
    validators:
      min: 0
    value_headers:
      - 线路长度
      - 总长
      - 数量
      - 数  量
  boxTransformerCount:
    name: 箱变数量
    value_type: number
    standard_unit: 台
    sections:
      include:
        - 箱式变压器
        - 箱变
        - 电气
        - 主要技术经济指标
      exclude:
        - 财务评价
    aliases:
      - 箱变数量
      - 箱式变压器数量
      - 箱变台数
      - 箱变
      - 机组升压变压器
    unit_aliases:
      - 台
    patterns:
      - (?:箱变数量|箱式变压器数量|箱变台数).{0,30}?([0-9]+)\s*(台)?
    validators:
      min: 0
    derived_patterns:
      - pattern: 
          (?:\u62df\u5b89\u88c5|\u5b89\u88c5)[^\u3002\uff1b;\n]{0,20}?([0-9]+)\s*\u53f0[^\u3002\uff1b;\n]{0,30}?\u548c\s*([0-9]+)\s*\u53f0[^\u3002\uff1b;\n]{0,80}\u98ce\u529b\u53d1\u7535\u673a\u7ec4
        op: sum_groups
        unit: 台
    regex_fallback_enabled: false
    coarse_table_rule_enabled: false
  boxTransformerCapacity:
    name: 箱变容量
    value_type: number
    standard_unit: kVA
    sections:
      include:
        - 箱式变压器
        - 箱变
        - 电气
      exclude:
        - 财务评价
    aliases:
      - 箱变容量
      - 箱式变压器容量
      - 变压器容量
    unit_aliases:
      - kVA
      - MVA
      - 千伏安
    patterns:
      - (?:箱变容量|箱式变压器容量|变压器容量).{0,30}?([0-9]+(?:\.[0-9]+)?)\s*(kVA|MVA|千伏安)?
    validators:
      min: 0
  substationVoltageLevel:
    name: 升压站电压等级
    value_type: number
    standard_unit: kV
    sections:
      include:
        - 升压站
        - 变电站
        - 电气
        - 接入系统
        - 主要技术经济指标
      exclude:
        - 风资源
        - 财务评价
    aliases:
      - 升压站电压等级
      - 升压站电压
      - 变电站电压等级
      - 110kV升压站
      - 新建110kV升压站
    unit_aliases:
      - kV
      - 千伏
    patterns:
      - ([0-9]+(?:\.[0-9]+)?)\s*(kV|\u5343\u4f0f)?\s*\u5347\u538b\u7ad9
      - (?:\u5347\u538b\u7ad9\u7535\u538b\u7b49\u7ea7|\u5347\u538b\u7ad9\u7535\u538b|\u53d8\u7535\u7ad9\u7535\u538b\u7b49\u7ea7).{0,30}?([0-9]+(?:\.[0-9]+)?)\s*(kV|\u5343\u4f0f)?
    validators:
      min: 0
  mainTransformerCapacity:
    name: 主变容量
    value_type: number
    standard_unit: MVA
    sections:
      include:
        - 升压站
        - 主变压器
        - 电气
        - 主要技术经济指标
      exclude:
        - 财务评价
        - 土建
        - 基础
        - 户外设备
    aliases:
      - 主变容量
      - 主变压器容量
      - 主变规模
    unit_aliases:
      - MVA
      - kVA
      - 兆伏安
    patterns:
      - '[0-9]+\s*(?:\u00d7|x|X)\s*([0-9]+(?:\.[0-9]+)?)\s*(MVA)'
      - (?:主变容量|主变压器容量|主变规模|容量为).{0,30}?([0-9]+(?:\.[0-9]+)?)\s*(MVA|kVA|兆伏安)?
    validators:
      min: 10
      max: 1000
  gridConnectionPoint:
    name: 接入点
    value_type: string
    sections:
      include:
        - 接入系统
        - 电网接入
        - 电气
      exclude:
        - 财务评价
    aliases:
      - 接入点
      - 并网点
      - 接入系统方案
    patterns:
      - (?:接入点|并网点|接入系统方案)[:：\s]*([^，。；;\n]{2,100})
