modules:
  aspose_loader:
    enabled: true
    mode: active

  rule_heading_detector:
    enabled: true
    mode: active

  alias_matcher:
    enabled: true
    mode: active

  indicator_discovery:
    enabled: true
    mode: active  # 原路径未抽到时，允许词典唯一精确命中的指标参与映射。

  table_rule_extractor:
    enabled: true
    mode: active

  regex_extractor:
    enabled: true
    mode: active

  semantic_analyzer:
    enabled: true
    mode: active
    near_window: 40

  funnel:
    # 高召回模式：候选值在规则选值前不做每字段 Top-K 截断。
    enabled: false
    mode: active
    stages:
      extraction_matches: 30
      semantic_candidates: 15
  validator:
    enabled: false
    mode: active

