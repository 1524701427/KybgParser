generation_text_fields:
  installedCapacity:
    patterns:
      - '(?:规划容量为|装机容量为|装机容量)\s*([0-9]+(?:\.[0-9]+)?)\s*MW'
      - '(?:规划容量为|装机容量为|装机容量)\s*([0-9]+(?:\.[0-9]+)?)\s*万千瓦'
  turbineCount:
    patterns:
      - '(?:安装|选择安装|拟建风电场安装|拟建风电场选择安装)\s*([0-9]+)\s*台'
  turbineCapacity:
    patterns:
      - '单机容量为\s*([0-9]+(?:\.[0-9]+)?)\s*kW'
  generationHubHeight:
    patterns:
      - '轮毂高度[^0-9]{0,12}([0-9]+(?:\.[0-9]+)?)\s*(?:m|米)'
  nonWakeLossFactor:
    patterns:
      - '不考虑尾流效应的折减系数\D{0,12}?([0-9]+(?:\.[0-9]+)?)\s*%'
      - '综合折减系数\D{0,12}?([0-9]+(?:\.[0-9]+)?)\s*%'
  gridAnnualEnergy:
    patterns:
      - '年上网(?:发)?电量\D{0,12}?([0-9]+(?:\.[0-9]+)?)\s*万\s*kW\s*[·\.]?\s*h'
      - '年上网(?:发)?电量\D{0,12}?([0-9]+(?:\.[0-9]+)?)\s*万\s*kWh'
  equivalentFullLoadHours:
    patterns:
      - '年等效满负荷小时数\D{0,12}?([0-9]+(?:\.[0-9]+)?)\s*h'

table_outputs:
  windFoundationTechnical:
    name: 风机基础参数表
    headers:
      - {key: capBottomRadius, name: 承台底面半径R}
      - {key: topRadius, name: 棱台顶面半径R1}
      - {key: columnRadius, name: 承台台柱半径R2}
      - {key: outerEdgeHeight, name: 承台底板外缘高度H1}
      - {key: coneHeight, name: 承台底板棱台高度H2}
      - {key: columnHeight, name: 台柱高度H3}
      - {key: buriedDepth, name: 基础埋深Hd}
      - {key: pileDiameter, name: 桩截面外径(直径)}
      - {key: pileCount, name: 桩数}
      - {key: averagePileLength, name: 桩长}
      - {key: pileRingCount, name: 桩圈数}
  windResourceDirectionEnergyFrequency:
    name: 测风塔风向风能频率统计成果表
    headers: []

original_table_groups:
  - key_prefix: resourceOriginalTable
    name: 资源章节原表
    title_only: true
    key_patterns:
      - key: windResourceTowerBasic
        patterns: ['测风塔基本情况表', '测风塔\s*基本情况表?']
      - key_template: windResourceEnergyParameter{tower}
        extraction_type: repeatable_original_table
        patterns: ['(?P<tower>[A-Za-z0-9]+)#\s*测风塔.*(?:风能参数统计成果表|各高度风能参数)']
      - key_template: windResourceSpeedPower{tower}
        extraction_type: repeatable_original_table
        patterns: ['(?P<tower>[A-Za-z0-9]+)#\s*测风塔.*(?:平均风速|风速).*风功率密度']
      - key_template: windResourceShear{tower}
        extraction_type: repeatable_original_table
        patterns: ['(?P<tower>[A-Za-z0-9]+)#\s*测风塔.*(?:切变统计表|风切变指数)']
      - key_template: windResourceTurbulence{speed}ms{tower}
        extraction_type: repeatable_original_table
        patterns: ['(?P<tower>[A-Za-z0-9]+)#\s*测风塔.*(?P<speed>10|15)\s*m/s\s*湍流(?:强度)?统计结果']
      - key_template: windResourceTurbulence{tower}
        extraction_type: repeatable_original_table
        patterns: ['(?P<tower>[A-Za-z0-9]+)#\s*测风塔.*湍流(?:强度)?(?:统计结果|计算成果|比较)?表?']
      - key: windResourceShearStatistics
        patterns: ['风切变指数(?:计算成果|统计)?表', '测风塔.*风切变.*(?:计算成果|统计|结果|计算结果)']
      - key: windResourceSpeedPowerStatistics
        patterns: ['(?:平均风速|风速).*风功率密度']
      - key: windResourceSectorDistribution
        patterns: ['扇区.*(?:风向|风能).*分布']
      - key: windResourceDirectionEnergyFrequency
        patterns:
          - '测风塔.*风向风能频率统计成果表'
          - '风向风能频率统计成果表'
          - '风向.*风能.*频率统计(?:成果)?表'
      - key: windResourceTurbulenceComparison
        patterns: ['湍流(?:强度)?(?:统计结果|计算成果|比较)?表']
    patterns:
      - '测风塔基本情况表'
      - '测风塔\s*基本情况表?'
      - '风切变指数(?:计算成果|统计)?表'
      - '测风塔.*风切变.*(?:计算成果|统计|结果|计算结果)'
      - '(?:平均风速|风速).*风功率密度'
      - '扇区.*(?:风向|风能).*分布'
      - '测风塔.*风向风能频率统计成果表'
      - '风向风能频率统计成果表'
      - '风向.*风能.*频率统计(?:成果)?表'
      - '湍流(?:强度)?(?:统计结果|计算成果|比较)?表'
      - '[A-Za-z0-9]+#.*测风塔.*(?:风能参数统计成果表|各高度风能参数|平均风速|风功率密度|风切变指数|切变统计表|湍流)'
  - key_prefix: generationOriginalTable
    name: 发电量章节原表
    title_only: true
    key_patterns:
      - key: generationSummary
        patterns: ['风电场工程.*(?:推荐方案)?(?:发电量|年上网电量)计算(?:成果)?表', '风电场发电量计算成果表']
      - key: singleTurbineAnnualEnergy
        patterns: ['推荐机型单机发电量统计表', '单台风机年上网电量计算成果表']
    patterns:
      - '风电场工程.*(?:推荐方案)?(?:发电量|年上网电量)计算(?:成果)?表'
      - '风电场发电量计算成果表'
      - '推荐机型单机发电量统计表'
      - '单台风机年上网电量计算成果表'
