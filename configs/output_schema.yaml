# Final JSON output schema. This controls required sections, fields, original
# document tables, passthrough table names, and enabled combined-table builders.

section_order:
  - 通用
  - 资源章节
  - 发电量章节
  - 地勘章节
  - 电气一次
  - 电气二次
  - 集电线路
  - 土建升压站
  - 风机基础
  - 箱变基础
  - 道路
  - 用地面积
  - 土石方平衡
  - 环保水保
  - 技经概算
  - 财务

common_section_fields:
  - projectName
  - investmentOwnerCompany
  - projectAddressCity
  - projectAddressCounty
  - projectAddressTown
  - projectAddressDetail
  - designUnit
  - designUnitQualification

