# result.json 二次抽取配置。
# 这份配置只描述“从已经抽到的表/字段里再取什么”，不参与主解析链路的原表匹配。
#
# 通用抽取原语：
# - 定位表：source_table.name_patterns（标题正则，支持 \s* 容忍空格差异）优先，
#   辅以 required_columns / required_text / name_match_content 做内容兜底。
# - 选行：row.type = label | index | last | first；row.match 支持多列联合匹配。
# - 选列：column.type = label（默认）| index | row_number（从行文本取数）。
# - towers：把一条规则按测风塔号模板展开成 N 条；可写固定列表，也可用 from_table 从表格动态发现塔号。
# - variables：通用模板变量，可把高度、风速段、年份、方案列等也模板化。
#   每个变量会生成 {name}、{name_clean}、{name_index}、{name_ordinal}；
#   例如 height.values: ['120m-推算', '160m（推算）'] 后，可在 field_code/row/column/source_table 中使用 {height}。
# - 操作：cell / cell_items / max_row_label / sector_max / column_values / cell_series / cell_ratio /
#   table_projection / copy_table / sum_fields。
version: 2

x_dynamic_wind_towers: &dynamic_wind_towers
  from_table:
    section: 资源章节
    source_table:
      name_patterns: ['测风塔基本情况表', '测风塔\s*基本情况表']
      required_columns: ['测风塔']
    column: {aliases: ['测风塔', '测风塔编号', '塔号']}
    value_pattern: '[A-Za-z0-9][A-Za-z0-9_-]{0,19}\s*[#＃]'

# 示例：高度也可以从表格动态发现，适合不同报告轮毂高度不一致的情况。
# 在规则中写 variables: {height: *dynamic_resource_heights} 后，用 {height} 选行，
# 用 {height_clean} 生成字段编码，避免把 120/140/160 写死到代码里。
# 如果规则同时有 towers，会先展开 {tower}，再按该塔号对应的表发现高度。
x_dynamic_resource_heights: &dynamic_resource_heights
  from_table:
    section: 资源章节
    source_table:
      name_patterns: ['{tower}.*(?:平均风速.*风功率密度|风能参数)', '平均风速.*风功率密度', '风能参数']
      name_match_content: true
      required_columns: ['高度']
      required_text: ['{tower}']
    column: {aliases: ['高度', '测风高度']}
    value_pattern: '\d+\s*m(?:[-－]?\s*推算|（推算）)?'

x_investment_equipment_price_table: &investment_equipment_price_table
  key: investmentEquipmentInstallation
  name_patterns: ['设备及安装工程概算表', '第二部分\s*设备及安装工程']
  name_match_content: true
  required_columns:
    - {aliases: ['项目名称及规格', '名称及规格', '项目名称', '名称']}
    - {aliases: ['单位']}
    - {aliases: ['数量']}

x_investment_equipment_fee_column: &investment_equipment_fee_column
  aliases: ['设备费', '设备购置费', '设备购置费（元）', '设备购置费(元)', '设备费（元）', '设备费(元)', '设备购置费（万元）', '设备购置费(万元)', '设备费（万元）', '设备费(万元)', '设备原价', '设备价格', '合计（万元）', '合计(万元)', '合计 （万元）', '合计   （万元）', '合计']
  offset: 1
  offset_when_source_matches: ['合计']
  conversion: yuan_to_wan_yuan_by_header

