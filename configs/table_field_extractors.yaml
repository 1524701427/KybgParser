  - {field_code: imageMonitoringSystemUnitPrice, field_name: 图像监控系统单价, name: 图像监控及安全警卫系统/视频监控系统/图像监控系统, aliases: ['图像监控及安全警卫系统', '视频监控系统', '图像监控系统']}
  - {field_code: fireAlarmSystemUnitPrice, field_name: 火灾报警系统单价, name: 火灾报警系统, aliases: ['火灾报警系统']}
  - {field_code: sf6EnvironmentalMonitorUnitPrice, field_name: SF6环境监测仪单价, name: SF6气体捡漏系统/SF6环境监测仪, aliases: ['SF6气体捡漏系统', 'SF6环境监测仪']}
  - {field_code: protectionFaultInformationSubsystemUnitPrice, field_name: 保护及故障信息管理子系统单价, name: 保护及故障信息管理子系统, aliases: ['保护及故障信息管理子系统']}
  - {field_code: opticalTerminalUnitPrice, field_name: 光端机单价, name: SDH光传输设备/SDH通信设备柜/光端机, aliases: ['SDH光传输设备', 'SDH通信设备柜', '光端机']}
  - {field_code: dataNetworkAccessRouterUnitPrice, field_name: 数据通信网接入路由器单价, name: 数据通信网接入路由器, aliases: ['数据通信网接入路由器']}
  - {field_code: dispatchIadEquipmentUnitPrice, field_name: 调度IAD设备单价, name: IAD接入设备屏/IAD机柜/IAD设备屏/调度IAD设备, aliases: ['IAD接入设备屏', 'IAD机柜', 'IAD设备屏', '调度IAD设备']}
  - {field_code: integratedDistributionFrameUnitPrice, field_name: 综合配线架单价, name: 综合配线屏/综合配线柜/综合配线架, aliases: ['综合配线屏', '综合配线柜', '综合配线架']}
  - {field_code: stateGridTmsTerminalUnitPrice, field_name: 国网通信管理系统（TMS）终端单价, name: 国网通信管理系统（TMS）终端, aliases: ['国网通信管理系统（TMS）终端', '国网通信管理系统(TMS)终端']}
  - {field_code: intelligentHighFrequencySwitchPowerPanelUnitPrice, field_name: 智能高频开关电源屏单价, name: 通讯电源屏/智能高频开关电源屏, aliases: ['通讯电源屏', '智能高频开关电源屏']}
  - {field_code: batteryBankUnitPrice, field_name: 蓄电池组单价, name: 通信电池屏/通信动环境监控系统屏/蓄电池组, aliases: ['通信电池屏', '通信动环境监控系统屏', '蓄电池组']}
  - {field_code: walkieTalkieUnitPrice, field_name: 无线对讲机单价, name: 对讲机/无线对讲机, aliases: ['对讲机', '无线对讲机']}
  - {field_code: programControlledDispatchExchangeUnitPrice, field_name: 程控调度交换机单价, name: 程控调度交换机, aliases: ['程控调度交换机']}
  - {field_code: primaryEquipmentPrefabricatedCabinUnitPrice, field_name: 一次设备预制舱单价, name: 一次设备预制舱, aliases: ['一次设备预制舱']}
  - {field_code: heatingVentilationAirConditioningSystemUnitPrice, field_name: 采暖通风及空调系统单价, name: 采暖通风及空调系统/轴流风机, aliases: ['采暖通风及空调系统', '轴流风机']}
  - {field_code: fireProtectionWaterSupplyDrainageSystemUnitPrice, field_name: 消防及给排水系统单价, name: 手提式干粉灭火器/消防泵, aliases: ['手提式干粉灭火器', '消防泵']}
  - {field_code: outdoorLightingSystemUnitPrice, field_name: 室外照明系统单价, name: 室外照明系统, aliases: ['室外照明系统']}
  - {field_code: occupationalSafetyHealthEquipmentUnitPrice, field_name: 劳动安全与职业卫生设备单价, name: 劳动安全与职业卫生设备, aliases: ['劳动安全与职业卫生设备']}
  - {field_code: productionOperationsVehicleUnitPrice, field_name: 生产运维车辆单价, name: 生产运维车辆, aliases: ['生产运维车辆']}

rules:
  # ========================================================================
  # 1. 风资源：按动态测风塔号抽取（塔号不再写死，由 *dynamic_wind_towers 从表中发现；
  #    表号也改为内容锚点，兼容不同报告编号不一致的情况）
  # ========================================================================
  # 各测风塔、各高度平均风速（高度由表格动态发现）
  - field_code: windResource{tower_clean}WindSpeed{height_clean}
    field_name: '{tower}测风塔{height}平均风速'
    section: 资源章节
    towers: *dynamic_wind_towers
    variables:
      height: *dynamic_resource_heights
    source_table:
      name_patterns: ['{tower}.*(?:风能参数|平均风速|风功率密度)']
      name_match_content: true
      required_columns: ['风速', '高度']
    row: {type: label, column: [高度], patterns: ['{height}']}
    column: {aliases: ['平均风速', '风速（m/s）', '风速']}
    value_type: number
    unit: m/s

  # 各测风塔、各高度平均风功率密度（高度由表格动态发现）
  - field_code: windResource{tower_clean}PowerDensity{height_clean}
    field_name: '{tower}测风塔{height}平均风功率密度'
    section: 资源章节
    towers: *dynamic_wind_towers
    variables:
      height: *dynamic_resource_heights
    source_table:
      name_patterns: ['{tower}.*(?:风能参数|平均风速|风功率密度)']
      name_match_content: true
      required_columns: ['风功率密度', '高度']
    row: {type: label, column: [高度], patterns: ['{height}']}
    column: {aliases: ['平均风功率密度', '风功率密度']}
    value_type: number
    unit: W/m²

  # 风切变综合值（值可能写在“综合风切变”行标签或紧随其后的单元格）
  - field_code: windResource{tower_clean}ShearComprehensive
    field_name: '{tower}测风塔风切变综合值'
    section: 资源章节
    towers: *dynamic_wind_towers
    source_table:
      name_patterns: ['{tower}.*(?:风切变|切变)']
      name_match_content: true
      required_text: ['综合风切变']
    row: {type: label, patterns: ['综合风切变']}
    column: {aliases: ['综合风切变', '综合值']}
    value_type: number

  # 各测风塔、各高度代表性湍流强度；风速段由最终结果构建器从表题或列名动态读取。
  - field_code: windResource{tower_clean}Turbulence{height_clean}
    field_name: '{tower}测风塔{height}代表性湍流强度'
    section: 资源章节
    towers: *dynamic_wind_towers
    variables:
      height:
        from_table:
          section: 资源章节
          source_table:
            name_patterns: ['{tower}.*湍流', '湍流强度']
            name_match_content: true
            required_text: ['湍流']
          value_pattern: '\d+(?:\.\d+)?\s*m'
    source_table:
      name_patterns: ['{tower}.*湍流', '湍流强度']
      name_match_content: true
      required_text: ['湍流']
    row: {type: label, column: [高度, 测风高度], patterns: ['{height}']}
    column: {aliases: ['代表性湍流强度', '代表湍流强度']}
    value_type: number

  # ========================================================================
  # 1.3 陕西华电靖边韩家沟200MW风电项目
  # ========================================================================
  # 1. 表2.4.1-1 测风塔基本情况表【测风塔】字段（整列塔号）
  - field_code: windResourceTowerCodes
    field_name: 测风塔编号
    section: 资源章节
    operation: column_values
    source_table:
      name_patterns: ['测风塔基本情况表', '测风塔\s*基本情况表']
      required_columns: ['测风塔']
    column: {aliases: ['测风塔']}
    value_type: text
    value_pattern: '[A-Za-z0-9]{2,8}#'

  - field_code: windTowerLongitude
    field_name: 测风塔经度
    section: 资源章节
    operation: column_values
    source_table:
      name_patterns: ['测风塔基本情况表', '测风塔\s*基本情况']
      name_match_content: true
    columns:
      - aliases: ['经度']
        exact: true
        value_pattern: '(?<![\d.])(?:东经|[Ee])?\s*\d{3}(?:(?:\.\d+)|(?:\s*[°度]\s*\d{1,2}(?:\.\d+)?(?:\s*[′分'']\s*\d{1,2}(?:\.\d+)?\s*[″秒"]?)?))?(?![\d.])'
      - aliases: ['经纬度', '坐标']
        value_pattern: '(?:东经|[Ee])\s*\d{2,3}(?:(?:\.\d+)|(?:\s*[°度]\s*\d{1,2}(?:\.\d+)?(?:\s*[′分'']\s*\d{1,2}(?:\.\d+)?\s*[″秒"]?)?))?'
    value_type: text

  - field_code: windTowerLatitude
    field_name: 测风塔纬度
    section: 资源章节
    operation: column_values
    source_table:
      name_patterns: ['测风塔基本情况表', '测风塔\s*基本情况']
      name_match_content: true
    columns:
      - aliases: ['纬度']
        exact: true
        value_pattern: '(?<![\d.])(?:北纬|[Nn])?\s*\d{2}(?:(?:\.\d+)|(?:\s*[°度]\s*\d{1,2}(?:\.\d+)?(?:\s*[′分'']\s*\d{1,2}(?:\.\d+)?\s*[″秒"]?)?))?(?![\d.])'
      - aliases: ['经纬度', '坐标']
        value_pattern: '(?:北纬|[Nn])\s*\d{2}(?:(?:\.\d+)|(?:\s*[°度]\s*\d{1,2}(?:\.\d+)?(?:\s*[′分'']\s*\d{1,2}(?:\.\d+)?\s*[″秒"]?)?))?'
    value_type: text

  - field_code: windMeasurementPeriod
    field_name: 测风周期
    section: 资源章节
    operation: column_values
    source_table:
      name_patterns: ['测风塔基本情况表', '测风塔\s*基本情况']
      name_match_content: true
    column: {aliases: ['测风周期', '测风时段', '观测周期', '观测时段']}
    value_type: text

  # 2. 表2.5.2.1-1 测风塔不同高度测风资料风切变指数统计表【各塔】->【拟合值】
  - field_code: windResourceShear{tower_clean}FittedValue
    field_name: '{tower}测风塔风切变拟合值'
    section: 资源章节
    towers: *dynamic_wind_towers
    source_table:
      name_patterns: ['风切变指数统计表', '测风资料风切变指数统计']
      required_columns: ['拟合值', '测风塔']
    row: {type: label, column: [测风塔], patterns: ['{tower}'], allow_ambiguous: true}
    column: {aliases: ['拟合值']}
    value_type: number

  # 3. 表2.5.3.1-1 测风塔各高度平均风速、风功率密度统计表【各塔】->【风速-平均】【风功率-平均】
  - field_code: windResource{tower_clean}SpeedAverage
    field_name: '{tower}测风塔平均风速'
    section: 资源章节
    towers: *dynamic_wind_towers
    source_table:
      name_patterns: ['平均风速.*风功率密度统计表', '风速.*m/s.*风功率密度.*W/m2']
      name_match_content: true
      required_columns: ['项目', '年均']
      required_text: ['风速', '风功率']
    row:
      type: label
      match:
        - {column: [测风塔], patterns: ['{tower}']}
        - {column: [项目], patterns: ['风速']}
    column: {aliases: ['年均', '平均']}
    value_type: number
    unit: m/s

  - field_code: windResource{tower_clean}PowerAverage
    field_name: '{tower}测风塔平均风功率密度'
    section: 资源章节
    towers: *dynamic_wind_towers
    source_table:
      name_patterns: ['平均风速.*风功率密度统计表', '风速.*m/s.*风功率密度.*W/m2']
      name_match_content: true
      required_columns: ['项目', '年均']
      required_text: ['风速', '风功率']
    row:
      type: label
      match:
        - {column: [测风塔], patterns: ['{tower}']}
        - {column: [项目], patterns: ['风功率']}
    column: {aliases: ['年均', '平均']}
    value_type: number
    unit: W/m²

  # 4. 表2.5.3.3-1 测风塔110m高度代表年各扇区风向和风能分布统计【各塔】最大值对应扇区
  - field_code: windResource{tower_clean}MaxWindDirectionSector
    field_name: '{tower}测风塔最大风速（风向频率）对应扇区'
    section: 资源章节
    towers: *dynamic_wind_towers
    operation: sector_max
    source_table:
      name_patterns: ['扇区风向和风能分布统计', '风向和风能分布统计']
      required_columns: ['测风塔', '扇区']
    tower: {patterns: ['{tower}']}
    tower_column: {aliases: ['测风塔']}
    metric_column: {aliases: ['扇区']}
    metric: {patterns: ['风向', '风速']}
    label: {patterns: ['扇区']}
    value_type: text

  - field_code: windResource{tower_clean}MaxPowerSector
    field_name: '{tower}测风塔最大风功率对应扇区'
    section: 资源章节
    towers: *dynamic_wind_towers
    operation: sector_max
    source_table:
      name_patterns: ['扇区风向和风能分布统计', '风向和风能分布统计']
      required_columns: ['测风塔', '扇区']
    tower: {patterns: ['{tower}']}
    tower_column: {aliases: ['测风塔']}
    metric_column: {aliases: ['扇区']}
    metric: {patterns: ['风功率']}
    label: {patterns: ['扇区']}
    value_type: text

  - field_code: windResource{tower_clean}SecondWindDirectionSector
    field_name: '{tower}测风塔风向第二大值对应扇区'
    section: 资源章节
    towers: *dynamic_wind_towers
    operation: sector_max
    rank: 2
    source_table:
      name_patterns: ['扇区风向和风能分布统计', '风向和风能分布统计']
      required_columns: ['测风塔', '扇区']
    tower: {patterns: ['{tower}']}
    tower_column: {aliases: ['测风塔']}
    metric_column: {aliases: ['扇区']}
    metric: {patterns: ['风向', '风速']}
    label: {patterns: ['扇区']}
    value_type: text

  - field_code: windResource{tower_clean}SecondPowerSector
    field_name: '{tower}测风塔风功率第二大值对应扇区'
    section: 资源章节
    towers: *dynamic_wind_towers
    operation: sector_max
    rank: 2
    source_table:
      name_patterns: ['扇区风向和风能分布统计', '风向和风能分布统计']
      required_columns: ['测风塔', '扇区']
    tower: {patterns: ['{tower}']}
    tower_column: {aliases: ['测风塔']}
    metric_column: {aliases: ['扇区']}
    metric: {patterns: ['风功率']}
    label: {patterns: ['扇区']}
    value_type: text

  # 测风塔为行、高度为列的湍流比较表；塔号和高度均动态发现。
  - field_code: windResource{tower_clean}TurbulenceColumn{height_clean}
    field_name: '{tower}测风塔{height}代表湍流强度'
    section: 资源章节
    towers: *dynamic_wind_towers
    variables:
      height:
        from_table:
          section: 资源章节
          source_table:
            name_patterns: ['湍流强度比较表', '不同高度湍流强度比较', '湍流强度']
            name_match_content: true
            required_text: ['湍流']
          value_pattern: '\d+(?:\.\d+)?\s*m'
    source_table:
      name_patterns: ['湍流强度比较表', '不同高度湍流强度比较']
      name_match_content: true
      required_text: ['湍流']
    row: {type: label, column: ['高度', '测风塔'], patterns: ['{tower}'], occurrence: 0}
    column: {aliases: ['{height}']}
    value_type: number

  - field_code: windDirectionMax{tower_clean}
    field_name: '{tower}最大风能频率对应风向'
    section: 资源章节
    towers: *dynamic_wind_towers
    operation: max_row_label
    source_table: {key: windResourceDirectionEnergyFrequency, name_patterns: ['测风塔风向风能频率统计成果表', '风向.*风能.*频率']}
    value_column: {aliases: ['{tower}风能频率', '{tower}']}
    label_column: {aliases: ['风向']}
    value_type: text

  - field_code: windShear{tower_clean}ComprehensiveValue
    field_name: '{tower}测风塔风速切变指数综合值'
    section: 资源章节
    towers: *dynamic_wind_towers
    source_table:
      name_patterns: ['{tower}.*(?:风速切变|风切变).*统计', '(?:风速切变|风切变).*统计']
      name_match_content: true
      required_text: ['综合值']
    row: {type: label, aliases: ['综合值'], occurrence: '{tower_index}'}
    column: {aliases: ['综合值', '风切变', '风切变指数']}
    value_type: number

  # 2.2 发电量（表号与机型列名均改为动态匹配，不再写死 5.3-1 / WTG204-6250）。
  - field_code: generationInstalledCapacityUnit
    field_name: 装机容量单位
    section: 发电量章节
    source_table:
      key: generationSummary
      name_patterns: ['风电场工程推荐方案发电量计算表', '年上网电量估算表', '风电场.*(?:发电量|上网电量)计算(?:成果)?表']
      required_columns: ['项目', '单位', '推荐方案']
      required_text: ['装机容量']
    row: {type: label, column: 项目, aliases: ['装机容量']}
    column: {aliases: ['单位']}
    value_type: text

  - field_code: generationInstalledCapacityRecommended
    field_name: 装机容量推荐方案
    section: 发电量章节
    source_table:
      key: generationSummary
      name_patterns: ['风电场工程推荐方案发电量计算表', '年上网电量估算表', '风电场.*(?:发电量|上网电量)计算(?:成果)?表']
      required_columns: ['项目', '单位', '推荐方案']
      required_text: ['装机容量']
    row: {type: label, column: 项目, aliases: ['装机容量']}
    column: {aliases: ['推荐方案']}
    value_type: number

  - field_code: generationTurbineCapacityUnit
    field_name: 单机容量单位
    section: 发电量章节
    source_table:
      key: generationSummary
      name_patterns: ['风电场工程推荐方案发电量计算表', '年上网电量估算表', '风电场.*(?:发电量|上网电量)计算(?:成果)?表']
      required_columns: ['项目', '单位', '推荐方案']
      required_text: ['单机容量']
    row: {type: label, column: 项目, aliases: ['单机容量']}
    column: {aliases: ['单位']}
    value_type: text

  - field_code: generationTurbineCapacityRecommended
    field_name: 单机容量推荐方案
    section: 发电量章节
    source_table:
      key: generationSummary
      name_patterns: ['风电场工程推荐方案发电量计算表', '年上网电量估算表', '风电场.*(?:发电量|上网电量)计算(?:成果)?表']
